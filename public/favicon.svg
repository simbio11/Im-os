<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="100%" stop-color="#16152b"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" stroke="url(#neonCyan)" stroke-width="6" stroke-opacity="0.5"/>
  
  <!-- Outer futuristic tech ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#neonPurple)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 8"/>
  
  <!-- Futuristic 3D Cube / Crystal Emblem -->
  <g filter="url(#glow)">
    <!-- Top diamond -->
    <path d="M256 120 L370 190 L256 256 L142 190 Z" fill="#00f0ff" fill-opacity="0.85"/>
    <!-- Left face -->
    <path d="M142 190 L256 256 L256 392 L142 326 Z" fill="#7000ff" fill-opacity="0.9"/>
    <!-- Right face -->
    <path d="M256 256 L370 190 L370 326 L256 392 Z" fill="#a855f7" fill-opacity="0.85"/>
    <!-- Center Core Glow -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="14" fill="#00f0ff"/>
  </g>
</svg>